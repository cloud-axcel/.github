<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" preserveAspectRatio="none">
<style>.s{animation:s 4s ease-in-out infinite}@keyframes s{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset=".5" stop-color="#F2445C"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
<rect y="5" width="1200" height="2" rx="1" fill="#8B97AD" fill-opacity=".25"/><rect class="s" y="4" width="300" height="4" rx="2" fill="url(#g)"/></svg>