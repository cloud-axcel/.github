<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Services: Software Development, AI Development, Business Automation, Team Augmentation, Technology Assessment and Orchestration">
<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
