.spin{animation:spin 6s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.ib{animation:pulse 3.2s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.18}50%{opacity:.32}}
