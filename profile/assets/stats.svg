<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.card{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.n{opacity:0} .fl{animation:fl .07s linear} .st{animation:st .01s linear forwards}
@keyframes fl{0%,100%{opacity:1}} @keyframes st{to{opacity:1}}
.bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.sh{animation:shine 6s ease-in-out infinite} @keyframes shine{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1500px)}}
.glow{animation:glow 3s ease-in-out infinite} @keyframes glow{0%,100%{opacity:.15}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
