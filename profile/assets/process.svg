<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="How we work: 1 Discovery, 2 Build, 3 Launch and support">
<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.dot{animation:travel 6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}5%{opacity:1}90%{transform:translateX(800px);opacity:1}100%{transform:translateX(800px);opacity:0}}
.flow{stroke-dasharray:6 10;animation:dash 1.2s linear infinite} @keyframes dash{to{stroke-dashoffset:-16}}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}25%{transform:scale(2.2);opacity:0}100%{opacity:0}}
.lit{animation:lit 6s ease-in-out infinite}
@keyframes lit{0%,100%{fill-opacity:.25}6%,20%{fill-opacity:1}35%{fill-opacity:.25}}
.in{opacity:0;animation:up .8s ease forwards} @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><radialGradient id="dg"><stop offset="0" stop-color="#FFF"/><stop offset=".4" stop-color="#F2445C"/><stop offset="1" stop-color="#F2445C" stop-opacity="0"/></radialGradient>
<linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset=".5" stop-color="#F2445C"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
<rect width="1200" height="230" rx="18" fill="#0A0F1C"/><rect width="1200" height="230" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<line class="flow" x1="200" y1="66" x2="1000" y2="66" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
<g class="in" style="animation-delay:0.2s">
<circle class="ping" cx="200" cy="66" r="34" fill="none" stroke="#3B82F6" stroke-width="2" style="animation-delay:0.00s"/>
<circle cx="200" cy="66" r="34" fill="#111A2E" stroke="#3B82F6" stroke-width="2"/>
<circle class="lit" cx="200" cy="66" r="34" fill="#3B82F6" style="animation-delay:0.00s"/>
<text class="f" x="200" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#E6EDF7">01</text>
<text class="f" x="200" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#E6EDF7">Discovery</text>
<text class="f" x="200" y="170" text-anchor="middle" font-size="16" fill="#94A3B8">We scope architecture, timeline</text><text class="f" x="200" y="192" text-anchor="middle" font-size="16" fill="#94A3B8">and pricing before any code.</text>
</g><g class="in" style="animation-delay:0.45s">
<circle class="ping" cx="600" cy="66" r="34" fill="none" stroke="#F2445C" stroke-width="2" style="animation-delay:2.76s"/>
<circle cx="600" cy="66" r="34" fill="#111A2E" stroke="#F2445C" stroke-width="2"/>
<circle class="lit" cx="600" cy="66" r="34" fill="#F2445C" style="animation-delay:2.76s"/>
<text class="f" x="600" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#E6EDF7">02</text>
<text class="f" x="600" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#E6EDF7">Build</text>
<text class="f" x="600" y="170" text-anchor="middle" font-size="16" fill="#94A3B8">Senior engineers ship in short</text><text class="f" x="600" y="192" text-anchor="middle" font-size="16" fill="#94A3B8">cycles — a working demo every week.</text>
</g><g class="in" style="animation-delay:0.7s">
<circle class="ping" cx="1000" cy="66" r="34" fill="none" stroke="#3B82F6" stroke-width="2" style="animation-delay:5.29s"/>
<circle cx="1000" cy="66" r="34" fill="#111A2E" stroke="#3B82F6" stroke-width="2"/>
<circle class="lit" cx="1000" cy="66" r="34" fill="#3B82F6" style="animation-delay:5.29s"/>
<text class="f" x="1000" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#E6EDF7">03</text>
<text class="f" x="1000" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#E6EDF7">Launch &amp; support</text>
<text class="f" x="1000" y="170" text-anchor="middle" font-size="16" fill="#94A3B8">We stay on after launch for</text><text class="f" x="1000" y="192" text-anchor="middle" font-size="16" fill="#94A3B8">fixes, iteration and scale.</text>
</g>
<circle class="dot" cx="200" cy="66" r="14" fill="url(#dg)"/>
</svg>